name: keepalive-supabase
# Supabase 免費專案閒置 1 週會暫停，每 3 天打一次輕量查詢保活
# 注意：新版 Supabase 閘道的 /rest/v1/ 根端點只接受 secret key（2026-11-09 診斷確認，
# 回 UNAUTHORIZED_INVALID_API_KEY_TYPE），因此改查一張有 anon 讀取 policy 的
# keepalive 小表，publishable key 即可。SUPABASE_ANON_KEY secret 現存的是新版
# publishable key（sb_publishable_ 開頭）。
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "%{http_code}\n"
